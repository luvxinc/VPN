name: Deploy to Mac Mini

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        working-directory: /Users/aaronsever/Developer/VPN
        run: git pull origin main

      - name: Build Go server
        working-directory: /Users/aaronsever/Developer/VPN/server/go
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          go build -ldflags="-s -w" -o ../authserver .

      - name: Apply DB Migrations
        working-directory: /Users/aaronsever/Developer/VPN/server
        run: |
          psql weiai_vpn -f db/migration_002_heartbeat.sql || true
          psql weiai_vpn -f db/migration_003_device_uuid.sql || true

      - name: Build client
        working-directory: /Users/aaronsever/Developer/VPN/client
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          bash build.sh

      - name: Sync min_version to config.yaml
        working-directory: /Users/aaronsever/Developer/VPN
        run: |
          MIN=$(grep 'MinClientVersion' server/go/config/config.go | grep -o '"[^"]*"' | tr -d '"')
          sed -i '' "s/min_version: \".*\"/min_version: \"$MIN\"/" server/config.yaml
          echo "min_version synced to $MIN"

      - name: Inject WS fallback domain into config.yaml
        working-directory: /Users/aaronsever/Developer/VPN
        run: |
          python3 - <<'PYEOF'
          import re, sys
          path = "server/config.yaml"
          txt = open(path).read()
          domain = "api.superaaron.com"
          if "ws_fallback_domain" in txt:
              txt = re.sub(r"ws_fallback_domain:.*", f'ws_fallback_domain: "{domain}"', txt)
          else:
              txt = re.sub(r"(  port:.*\n)", rf'\1  ws_fallback_domain: "{domain}"\n', txt, count=1)
          open(path, "w").write(txt)
          print(f"ws_fallback_domain set to {domain}")
          PYEOF

      - name: Fix pf redirect rule (automatically bound to active default interface for correct LAN routing)
        run: |
          ACTIVE_IF=$(route get default | grep interface | awk '{print $2}')
          EN_IP=$(ipconfig getifaddr $ACTIVE_IF 2>/dev/null || echo "")
          if [ -n "$EN_IP" ]; then
            # Replace loopback redirect with the actual interface IP so return-path routing works
            sudo -n sed -i '' \
              "s|rdr pass inet proto tcp from any to any port = 443 -> .* port 8443|rdr pass on $ACTIVE_IF proto tcp from any to any port = 443 -> $EN_IP port 8443|g" \
              /etc/pf.conf || echo "Skipped sed pf.conf due to sudo password requirement"
            sudo -n pfctl -f /etc/pf.conf 2>/dev/null || echo "Skipped pfctl due to sudo password requirement"
            echo "pf rule updated: bound to $ACTIVE_IF with IP $EN_IP (if sudo succeeded)"
          else
            echo "Active IP not found, skipping pf update"
          fi

      - name: Reload service
        run: launchctl kickstart -k gui/$(id -u)/com.weiai.authserver
