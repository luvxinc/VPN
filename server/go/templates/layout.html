{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}{{t "app.name"}} {{t "app.console"}}{{end}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    [x-cloak] { display: none; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-56 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
    <div class="px-4 py-5 border-b border-gray-800">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-red-500 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/>
        </svg>
        <span class="font-bold text-white">{{t "app.name"}}</span>
      </div>
      <p class="text-xs text-gray-500 mt-1">{{t "app.console"}}</p>
    </div>
    <nav class="flex-1 p-3 space-y-1">
      <a href="/admin/dashboard" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white transition-colors{{if eq .CurrentPath "/admin/dashboard"}} bg-gray-700 text-white{{end}}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7h18M3 12h18M3 17h18"/></svg>
        {{t "nav.dashboard"}}
      </a>
      <a href="/admin/users" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white transition-colors{{if contains .CurrentPath "/users"}} bg-gray-700 text-white{{end}}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        {{t "nav.users"}}
      </a>
      <a href="/admin/logs" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white transition-colors{{if contains .CurrentPath "/logs"}} bg-gray-700 text-white{{end}}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        {{t "nav.logs"}}
      </a>
      <a href="/admin/stats" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white transition-colors{{if contains .CurrentPath "/stats"}} bg-gray-700 text-white{{end}}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        {{t "nav.stats"}}
      </a>
    </nav>
    <div class="p-3 border-t border-gray-800 space-y-1">
      <!-- Language toggle -->
      <div class="flex items-center gap-1 px-4 py-1">
        <svg class="w-3.5 h-3.5 text-gray-500 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
        <a href="/admin/lang?lang=en" id="lang-en"
           class="text-xs px-2 py-0.5 rounded transition-colors hover:text-white">EN</a>
        <span class="text-gray-700 text-xs">|</span>
        <a href="/admin/lang?lang=zh" id="lang-zh"
           class="text-xs px-2 py-0.5 rounded transition-colors hover:text-white">中文</a>
      </div>
      <form action="/admin/logout" method="post">
        <button type="submit" class="w-full flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-red-400 hover:text-red-300 hover:bg-red-900/30 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          {{t "nav.signOut"}}
        </button>
      </form>
    </div>
    <script>
    (function(){
      var lang = (document.cookie.split(';').find(function(c){return c.trim().startsWith('lang=');}) || '').split('=')[1] || 'en';
      var active = lang === 'zh' ? document.getElementById('lang-zh') : document.getElementById('lang-en');
      var inactive = lang === 'zh' ? document.getElementById('lang-en') : document.getElementById('lang-zh');
      if(active){ active.className += ' text-white font-semibold'; }
      if(inactive){ inactive.className += ' text-gray-500'; }
    })();
    </script>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-auto">
    <div class="max-w-6xl mx-auto px-6 py-6">
      {{embed}}
    </div>
  </main>

  {{block "scripts" .}}{{end}}
</body>
</html>
{{end}}
