<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>管理员登录 — 为爱鼓掌 VPN</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen">
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-sm shadow-xl">
    <div class="text-center mb-8">
      <span class="text-4xl">❤</span>
      <h1 class="text-xl font-bold text-white mt-2">为爱鼓掌 VPN</h1>
      <p class="text-sm text-gray-400">管理员登录</p>
    </div>
    <form action="/admin/login" method="post" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">用户名</label>
        <input type="text" name="username" required autocomplete="username"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">密码</label>
        <input type="password" name="password" required autocomplete="current-password"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>
      <button type="submit"
              class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded-lg transition-colors mt-2">
        登录
      </button>
    </form>
    <p class="text-xs text-gray-600 text-center mt-6">仅限局域网访问</p>
  </div>
</body>
</html>
