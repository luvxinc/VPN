<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{t "login.title"}} — {{t "app.name"}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen">
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-sm shadow-xl">
    <div class="text-center mb-8">
      <svg class="w-12 h-12 text-red-500 mx-auto" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/>
      </svg>
      <h1 class="text-xl font-bold text-white mt-2">{{t "app.name"}}</h1>
      <p class="text-sm text-gray-400">{{t "login.title"}}</p>
    </div>
    <form action="/admin/login" method="post" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">{{t "login.username"}}</label>
        <input type="text" name="username" required autocomplete="username"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">{{t "login.password"}}</label>
        <input type="password" name="password" required autocomplete="current-password"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>
      <button type="submit"
              class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded-lg transition-colors mt-2">
        {{t "login.submit"}}
      </button>
    </form>
    <p class="text-xs text-gray-600 text-center mt-6">{{t "login.lanOnly"}}</p>
  </div>
</body>
</html>
